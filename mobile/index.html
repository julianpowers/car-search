<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owensboro Used Car Search — Mobile</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#175cd3;--green:#067647}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:18px 12px 42px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
h1{font-size:26px;line-height:1.05;letter-spacing:-.025em;margin:0}
.desktop{font-size:13px;white-space:nowrap;color:var(--blue);text-decoration:none;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:8px 0 6px}
.updated{font-size:12px;color:#475467;margin-bottom:16px}
.grid{display:grid;gap:14px}
.car{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.thumb{width:100%;aspect-ratio:16/9;background:#eaecf0;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:13px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:15px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rank{min-width:34px;height:34px;border-radius:999px;background:#f2f4f7;display:flex;align-items:center;justify-content:center;font-weight:800}
.title{font-size:19px;line-height:1.2;font-weight:800;flex:1}
.price{font-size:22px;font-weight:850;letter-spacing:-.02em;margin-top:8px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.meta div{background:#f9fafb;border-radius:10px;padding:9px 10px}
.label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.value{font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:750;background:#f2f4f7;color:#344054}
.badge.hybrid{background:#ecfdf3;color:var(--green)}
.badge.awd{background:#eff8ff;color:var(--blue)}
.assessment{margin:12px 0;color:#344054}
.button{display:block;width:100%;padding:12px 14px;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;border-radius:10px}
.summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}
.summary h2{font-size:20px;margin:0 0 10px}
.summary p{margin:0 0 10px;color:#344054}
.note{color:var(--muted);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Used Car Leaderboard</h1>
    <a class="desktop" href="../">Table view</a>
  </div>
  <div class="sub">42301 · ~50 miles · $10k–$20k · sedan/small crossover · hybrid preferred · AWD a plus</div>
  <div class="updated" id="updated"></div>
  <main class="grid" id="cards"></main>
  <section class="summary">
    <h2>Summary</h2>
    <div id="summary"></div>
    <div class="note">Prices and availability can change quickly. Verify the listing, title history, accident history and total dealer fees before traveling.</div>
  </section>
</div>
<script src="../data.js"></script>
<script>
const fmt=n=>new Intl.NumberFormat('en-US').format(n);
document.getElementById('updated').textContent='Last updated: '+CAR_DATA.updated;
document.getElementById('summary').innerHTML=CAR_DATA.summary.map(x=>'<p>'+x+'</p>').join('');
document.getElementById('cards').innerHTML=CAR_DATA.cars.map(c=>{
  const thumb=c.image
    ? '<div class="thumb"><img src="'+c.image+'" alt="'+c.year+' '+c.vehicle+'" loading="lazy" onerror="this.parentElement.innerHTML=\'Photo unavailable\'"></div>'
    : '<div class="thumb">Photo unavailable</div>';
  const badges=(c.fuel==='Hybrid'?'<span class="badge hybrid">Hybrid</span>':'<span class="badge">'+c.fuel+'</span>')+
    (c.drive && c.drive.includes('WD')?'<span class="badge awd">'+c.drive+'</span>':'<span class="badge">'+c.drive+'</span>');
  return '<article class="car">'+thumb+
    '<div class="body"><div class="head"><div class="rank">'+c.rank+'</div><div class="title">'+c.year+' '+c.vehicle+'</div></div>'+
    '<div class="price">$'+fmt(c.price)+'</div>'+
    '<div class="badges">'+badges+'</div>'+
    '<div class="meta"><div><span class="label">Mileage</span><span class="value">'+fmt(c.miles)+' mi</span></div>'+
    '<div><span class="label">Body</span><span class="value">'+c.type+'</span></div>'+
    '<div><span class="label">Dealer</span><span class="value">'+c.dealer+'</span></div>'+
    '<div><span class="label">Area</span><span class="value">'+c.area+'</span></div></div>'+
    '<div class="assessment">'+c.assessment+'</div>'+
    '<a class="button" href="'+c.url+'" target="_blank" rel="noopener">View vehicle listing ↗</a></div></article>';
}).join('');
</script>
</body>
</html>
