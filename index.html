<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owensboro Used Car Leaderboard</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fa;color:#111827}.wrap{max-width:1250px;margin:auto;padding:32px 18px}h1{margin-bottom:6px}.sub{color:#667085;margin-bottom:8px}.mobilelink{display:inline-block;margin-bottom:16px;color:#175cd3;font-weight:700;text-decoration:none}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;margin-bottom:24px}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px 14px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f9fafb;font-size:12px;text-transform:uppercase;color:#667085}.rank{font-weight:800}.price{font-weight:800}.hybrid,.awd{font-weight:700}.hybrid{color:#067647}.awd{color:#175cd3}a{color:#175cd3}.summary{padding:24px}.summary p{max-width:950px}.updated{font-size:13px;color:#475467;margin-bottom:18px}
</style></head><body><div class="wrap"><h1>Owensboro Used Car Leaderboard</h1><div class="sub">42301 · ~50 mile radius · $10,000–$20,000 · sedan or small crossover · low mileage preferred · hybrid preferred · AWD a plus</div><a class="mobilelink" href="mobile/">Open mobile card view →</a><div class="updated" id="updated"></div>
<div class="card table"><table><thead><tr><th>#</th><th>Vehicle</th><th>Price</th><th>Miles</th><th>Type</th><th>Fuel</th><th>Drive</th><th>Dealer / Area</th><th>Assessment</th><th>Direct link</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card summary"><h2>Summary</h2><div id="summary"></div></div></div><script src="data.js"></script><script>
const fmt=n=>new Intl.NumberFormat('en-US').format(n);document.getElementById('updated').textContent='Last updated: '+CAR_DATA.updated;document.getElementById('summary').innerHTML=CAR_DATA.summary.map(x=>'<p>'+x+'</p>').join('');document.getElementById('rows').innerHTML=CAR_DATA.cars.map(c=>'<tr><td class="rank">'+c.rank+'</td><td><strong>'+c.year+' '+c.vehicle+'</strong></td><td class="price">$'+fmt(c.price)+'</td><td>'+fmt(c.miles)+'</td><td>'+c.type+'</td><td class="'+(c.fuel==='Hybrid'?'hybrid':'')+'">'+c.fuel+'</td><td class="'+(c.drive.includes('WD')?'awd':'')+'">'+c.drive+'</td><td>'+c.dealer+'<br><small>'+c.area+'</small></td><td>'+c.assessment+'</td><td><a href="'+c.url+'" target="_blank" rel="noopener">View listing</a></td></tr>').join('');
</script></body></html>
